# Environnement de développement : PostgreSQL 16 uniquement.
# Port hôte 5433 (5432 est souvent occupé par une installation locale de PostgreSQL).
services:
  postgres:
    image: postgres:16-alpine
    container_name: lt-expertise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lt_expertise}
      POSTGRES_USER: ${DB_USER:-lt_expertise}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lt_expertise_dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - lt-expertise-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lt-expertise-pgdata:
