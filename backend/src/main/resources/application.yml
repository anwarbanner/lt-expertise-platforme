spring:
  application:
    name: lt-expertise
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/lt_expertise}
    username: ${DB_USER:lt_expertise}
    password: ${DB_PASSWORD:lt_expertise_dev}
  jpa:
    # Le schéma est géré exclusivement par Flyway.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
