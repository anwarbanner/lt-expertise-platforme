spring:
  application:
    name: lt-expertise
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/lt_expertise}
    username: ${DB_USER:lt_expertise}
    password: ${DB_PASSWORD:lt_expertise_dev}
  jpa:
    # Le schéma est géré exclusivement par Flyway.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB

server:
  port: ${SERVER_PORT:8080}

lt:
  # PDF originaux (P1) : MinIO local, jamais un service cloud (P11).
  stockage:
    url: ${MINIO_URL:http://localhost:9000}
    cle-acces: ${MINIO_ACCESS_KEY:lt_expertise}
    cle-secrete: ${MINIO_SECRET_KEY:lt_expertise_dev}
    bucket: ${MINIO_BUCKET:rapports-originaux}
  import:
    # Aligné sur spring.servlet.multipart.max-file-size
    taille-max-octets: 20971520

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
